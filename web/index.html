<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eco-Travel Advisor</title>

    <style>

        /* =========================
           GLOBAL SETTINGS
        ========================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            background:
                radial-gradient(circle at 15% 20%, rgba(129, 199, 132, 0.35), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(46, 125, 50, 0.25), transparent 30%),
                linear-gradient(135deg, #e8f5e9, #f1f8e9, #e0f2f1);

            overflow: hidden;
            position: relative;
        }


        /* =========================
           ANIMATED BACKGROUND
        ========================== */

        .background-circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(3px);
            opacity: 0.25;

            animation: floating 8s ease-in-out infinite;
        }

        .circle-one {
            width: 220px;
            height: 220px;

            background: #66bb6a;

            top: -70px;
            left: -70px;
        }

        .circle-two {
            width: 280px;
            height: 280px;

            background: #26a69a;

            bottom: -120px;
            right: -80px;

            animation-delay: 2s;
        }

        .circle-three {
            width: 150px;
            height: 150px;

            background: #9ccc65;

            top: 20%;
            right: 8%;

            animation-delay: 4s;
        }

        @keyframes floating {

            0%,
            100% {
                transform: translateY(0px) translateX(0px);
            }

            50% {
                transform: translateY(-25px) translateX(15px);
            }
        }


        /* =========================
           CHAT CONTAINER
        ========================== */

        .container {

            width: 100%;
            max-width: 470px;

            height: 720px;
            max-height: 92vh;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 24px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.18),
                0 8px 25px rgba(46, 125, 50, 0.12);

            overflow: hidden;

            position: relative;
            z-index: 10;

            display: flex;
            flex-direction: column;

            animation: containerAppear 0.7s ease;
        }

        @keyframes containerAppear {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           HEADER
        ========================== */

        .header {

            background:
                linear-gradient(
                    135deg,
                    #1b5e20,
                    #2e7d32,
                    #43a047
                );

            color: white;

            padding: 22px 22px 20px;

            position: relative;

            overflow: hidden;
        }

        .header::after {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.08);

            top: -100px;
            right: -60px;
        }

        .header-content {

            display: flex;
            align-items: center;

            position: relative;
            z-index: 2;
        }

        .bot-logo {

            width: 55px;
            height: 55px;

            border-radius: 16px;

            background: rgba(255, 255, 255, 0.18);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            margin-right: 14px;

            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow:
                inset 0 0 10px rgba(255, 255, 255, 0.1);

            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        .header-text h2 {

            margin-bottom: 4px;

            font-size: 22px;
            font-weight: 700;
        }

        .status {

            font-size: 13px;

            display: flex;
            align-items: center;

            opacity: 0.9;
        }

        .status-dot {

            width: 8px;
            height: 8px;

            background: #b9f6ca;

            border-radius: 50%;

            margin-right: 7px;

            box-shadow: 0 0 8px #b9f6ca;

            animation: pulse 1.6s infinite;
        }

        @keyframes pulse {

            0% {
                box-shadow: 0 0 0 0 rgba(185, 246, 202, 0.7);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(185, 246, 202, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(185, 246, 202, 0);
            }
        }


        /* =========================
           CHAT AREA
        ========================== */

        #chatbox {

            flex: 1;

            padding: 20px 18px;

            overflow-y: auto;

            scroll-behavior: smooth;

            background:
                linear-gradient(
                    rgba(248, 253, 249, 0.94),
                    rgba(245, 250, 246, 0.94)
                );
        }


        /* Scrollbar */

        #chatbox::-webkit-scrollbar {
            width: 6px;
        }

        #chatbox::-webkit-scrollbar-track {
            background: transparent;
        }

        #chatbox::-webkit-scrollbar-thumb {

            background: #b7d9ba;

            border-radius: 10px;
        }


        /* =========================
           MESSAGE ROW
        ========================== */

        .message-row {

            width: 100%;

            display: flex;

            margin-bottom: 16px;

            animation: messageAppear 0.35s ease;
        }

        @keyframes messageAppear {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           BOT MESSAGE
        ========================== */

        .bot-row {
            justify-content: flex-start;
        }

        .bot-avatar {

            width: 34px;
            height: 34px;

            min-width: 34px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 9px;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #66bb6a
                );

            color: white;

            font-size: 17px;

            box-shadow: 0 3px 8px rgba(46, 125, 50, 0.22);
        }

        .bot-message {

            max-width: 78%;

            padding: 11px 14px;

            background: white;

            color: #37474f;

            border-radius:
                5px 16px 16px 16px;

            font-size: 14px;

            line-height: 1.55;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.07);

            border: 1px solid #edf3ed;

            word-wrap: break-word;
        }


        /* =========================
           USER MESSAGE
        ========================== */

        .user-row {
            justify-content: flex-end;
        }

        .user-message {

            max-width: 78%;

            padding: 11px 14px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #43a047
                );

            border-radius:
                16px 5px 16px 16px;

            font-size: 14px;

            line-height: 1.55;

            box-shadow:
                0 3px 12px rgba(46, 125, 50, 0.25);

            word-wrap: break-word;
        }


        /* =========================
           TIMESTAMP
        ========================== */

        .message-time {

            display: block;

            margin-top: 5px;

            font-size: 10px;

            opacity: 0.65;

            text-align: right;
        }


        /* =========================
           INTRO SECTION
        ========================== */

        .welcome-area {

            text-align: center;

            padding: 10px 10px 18px;

            animation: messageAppear 0.5s ease;
        }

        .welcome-icon {

            width: 65px;
            height: 65px;

            margin: 0 auto 10px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9,
                    #c8e6c9
                );

            box-shadow: 0 5px 18px rgba(46, 125, 50, 0.15);
        }

        .welcome-area h3 {

            font-size: 18px;

            color: #1b5e20;

            margin-bottom: 5px;
        }

        .welcome-area p {

            color: #78909c;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =========================
           SUGGESTION BUTTONS
        ========================== */

        .suggestions {

            display: flex;
            flex-wrap: wrap;

            gap: 8px;

            margin: 6px 0 20px 43px;
        }

        .suggestion-btn {

            border: 1px solid #c8e6c9;

            background: #f1f8e9;

            color: #2e7d32;

            border-radius: 18px;

            padding: 7px 12px;

            font-size: 12px;

            cursor: pointer;

            transition: 0.3s;

            margin: 0;
        }

        .suggestion-btn:hover {

            background: #2e7d32;
            color: white;

            transform: translateY(-2px);

            box-shadow:
                0 4px 10px rgba(46, 125, 50, 0.2);
        }


        /* =========================
           TYPING INDICATOR
        ========================== */

        .typing-message {

            padding: 12px 15px;

            background: white;

            border-radius:
                5px 16px 16px 16px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.06);

            display: flex;
            gap: 5px;
        }

        .typing-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #81c784;

            animation: typingAnimation 1.2s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }


        /* =========================
           INPUT AREA
        ========================== */

        .input-container {

            padding: 13px 15px 15px;

            background: white;

            border-top: 1px solid #edf2ed;
        }

        .input-area {

            display: flex;

            align-items: center;

            background: #f5f8f5;

            border: 1px solid #dfe8df;

            border-radius: 18px;

            padding: 5px;

            transition: 0.25s ease;
        }

        .input-area:focus-within {

            border-color: #66bb6a;

            box-shadow:
                0 0 0 3px rgba(102, 187, 106, 0.13);
        }

        #message {

            flex: 1;

            padding: 11px 12px;

            border: none;

            outline: none;

            background: transparent;

            font-size: 14px;

            color: #37474f;
        }

        #message::placeholder {
            color: #9eaaa0;
        }


        /* =========================
           SEND BUTTON
        ========================== */

        .send-button {

            width: 44px;
            height: 44px;

            min-width: 44px;

            border-radius: 14px;

            border: none;

            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2e7d32,
                    #43a047
                );

            box-shadow:
                0 4px 12px rgba(46, 125, 50, 0.28);

            transition: 0.25s;

            font-size: 18px;
        }

        .send-button:hover {

            transform:
                translateY(-2px)
                scale(1.04);

            box-shadow:
                0 6px 16px rgba(46, 125, 50, 0.35);
        }

        .send-button:active {

            transform: scale(0.94);
        }

        .send-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================
           FOOTER
        ========================== */

        .footer-text {

            text-align: center;

            margin-top: 8px;

            font-size: 10px;

            color: #90a493;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 520px) {

            body {

                padding: 0;

                align-items: stretch;
            }

            .container {

                max-width: 100%;

                height: 100vh;
                max-height: 100vh;

                border-radius: 0;
            }

            .header {

                padding-top: 18px;
            }

            .bot-message,
            .user-message {

                max-width: 84%;
            }

            .background-circle {
                display: none;
            }
        }

    </style>
</head>


<body>


<!-- Animated background -->

<div class="background-circle circle-one"></div>
<div class="background-circle circle-two"></div>
<div class="background-circle circle-three"></div>



<!-- =========================
     CHAT APPLICATION
========================== -->

<div class="container">


    <!-- Header -->

    <div class="header">

        <div class="header-content">

            <div class="bot-logo">
                🌱
            </div>

            <div class="header-text">

                <h2>Eco-Travel Advisor</h2>

                <div class="status">

                    <div class="status-dot"></div>

                    Sustainable Travel Assistant • Online

                </div>

            </div>

        </div>

    </div>



    <!-- Chat Area -->

    <div id="chatbox">


        <!-- Welcome Section -->

        <div class="welcome-area">

            <div class="welcome-icon">
                🌍
            </div>

            <h3>Travel greener. Explore smarter.</h3>

            <p>
                Ask me about sustainable destinations,
                eco-friendly transport and responsible travel.
            </p>

        </div>


        <!-- Initial Bot Message -->

        <div class="message-row bot-row">

            <div class="bot-avatar">
                🌿
            </div>

            <div class="bot-message">

                Hello! 👋 I am your Eco-Travel Advisor.
                Where would you like to travel?

                <span class="message-time">
                    Now
                </span>

            </div>

        </div>


        <!-- Quick Suggestions -->

        <div
            class="suggestions"
            id="suggestions"
        >

            <button
                class="suggestion-btn"
                onclick="useSuggestion('I want to go to Paris')"
            >
                ✈️ Visit Paris
            </button>

            <button
                class="suggestion-btn"
                onclick="useSuggestion('Suggest an eco-friendly destination')"
            >
                🌱 Eco destination
            </button>

            <button
                class="suggestion-btn"
                onclick="useSuggestion('How can I travel sustainably?')"
            >
                🚆 Sustainable travel
            </button>

        </div>


    </div>



    <!-- Input -->

    <div class="input-container">

        <div class="input-area">

            <input
                id="message"
                type="text"
                placeholder="Ask about your next eco-friendly trip..."
                autocomplete="off"
            >

            <button
                id="sendButton"
                class="send-button"
                onclick="sendMessage()"
                title="Send message"
            >
                ➤
            </button>

        </div>

        <div class="footer-text">
            🌱 Powered by Eco-Travel Advisor
        </div>

    </div>


</div>



<script>


/* ======================================
   ESCAPE HTML
   Prevent HTML entered by user
   from being executed.
====================================== */

function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* ======================================
   CURRENT TIME
====================================== */

function getCurrentTime() {

    const now = new Date();

    return now.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* ======================================
   ADD USER MESSAGE
====================================== */

function addUserMessage(message) {

    const chatbox =
        document.getElementById("chatbox");

    const safeMessage =
        escapeHTML(message);

    const messageHTML = `

        <div class="message-row user-row">

            <div class="user-message">

                ${safeMessage}

                <span class="message-time">
                    ${getCurrentTime()}
                </span>

            </div>

        </div>

    `;

    chatbox.insertAdjacentHTML(
        "beforeend",
        messageHTML
    );

    scrollToBottom();
}


/* ======================================
   ADD BOT MESSAGE
====================================== */

function addBotMessage(message) {

    const chatbox =
        document.getElementById("chatbox");

    const safeMessage =
        escapeHTML(message);

    const messageHTML = `

        <div class="message-row bot-row">

            <div class="bot-avatar">
                🌿
            </div>

            <div class="bot-message">

                ${safeMessage}

                <span class="message-time">
                    ${getCurrentTime()}
                </span>

            </div>

        </div>

    `;

    chatbox.insertAdjacentHTML(
        "beforeend",
        messageHTML
    );

    scrollToBottom();
}


/* ======================================
   SHOW TYPING INDICATOR
====================================== */

function showTypingIndicator() {

    const chatbox =
        document.getElementById("chatbox");

    removeTypingIndicator();

    const typingHTML = `

        <div
            class="message-row bot-row"
            id="typingIndicator"
        >

            <div class="bot-avatar">
                🌿
            </div>

            <div class="typing-message">

                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>

            </div>

        </div>

    `;

    chatbox.insertAdjacentHTML(
        "beforeend",
        typingHTML
    );

    scrollToBottom();
}


/* ======================================
   REMOVE TYPING INDICATOR
====================================== */

function removeTypingIndicator() {

    const typing =
        document.getElementById(
            "typingIndicator"
        );

    if (typing) {
        typing.remove();
    }
}


/* ======================================
   SCROLL TO BOTTOM
====================================== */

function scrollToBottom() {

    const chatbox =
        document.getElementById("chatbox");

    chatbox.scrollTop =
        chatbox.scrollHeight;
}


/* ======================================
   QUICK SUGGESTION
====================================== */

function useSuggestion(text) {

    const input =
        document.getElementById("message");

    input.value = text;

    sendMessage();
}


/* ======================================
   SEND MESSAGE TO RASA
====================================== */

async function sendMessage() {

    const input =
        document.getElementById("message");

    const sendButton =
        document.getElementById("sendButton");

    const message =
        input.value.trim();


    /* Prevent empty messages */

    if (message === "") {
        return;
    }


    /* Display user message */

    addUserMessage(message);


    /* Clear input */

    input.value = "";


    /* Disable button while waiting */

    sendButton.disabled = true;


    /* Remove quick suggestions */

    const suggestions =
        document.getElementById("suggestions");

    if (suggestions) {

        suggestions.style.display =
            "none";
    }


    /* Show bot typing animation */

    showTypingIndicator();


    try {


        /* ==================================
           SAME RASA API / SAME ROUTE
        ================================== */

        const response = await fetch(

            "http://localhost:5005/webhooks/rest/webhook",

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body: JSON.stringify({

                    sender: "web_user",

                    message: message

                })

            }

        );


        /* Check server response */

        if (!response.ok) {

            throw new Error(
                "Server returned an error"
            );

        }


        const data =
            await response.json();


        /* Remove typing animation */

        removeTypingIndicator();


        /* Display Rasa responses */

        if (
            Array.isArray(data) &&
            data.length > 0
        ) {

            data.forEach(reply => {

                if (reply.text) {

                    addBotMessage(
                        reply.text
                    );

                }

            });

        } else {

            addBotMessage(
                "I received your message, but I don't have a response for that yet. 🌱"
            );

        }


    } catch (error) {


        removeTypingIndicator();


        addBotMessage(
            "⚠️ Unable to connect to the Rasa server. Please make sure the Rasa server is running."
        );


        console.error(
            "Rasa connection error:",
            error
        );

    } finally {


        /* Enable send button */

        sendButton.disabled = false;


        /* Put cursor back in input */

        input.focus();


        scrollToBottom();

    }

}


/* ======================================
   SEND MESSAGE WITH ENTER
====================================== */

document
    .getElementById("message")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


/* ======================================
   FOCUS INPUT WHEN PAGE LOADS
====================================== */

window.addEventListener(
    "load",
    function() {

        document
            .getElementById("message")
            .focus();

    }
);


</script>


</body>

</html>
